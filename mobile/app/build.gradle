plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dsh.desktop.remote'
    compileSdk 36

    defaultConfig {
        applicationId 'com.dsh.desktop.remote'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            // 首个版本直接用 debug 签名，方便个人侧载；正式对外发布前再换成正式 keystore
            storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
